[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-watch-history-automation"
version = "0.1.0"
description = "Extract TikTok watch-history links with an Android device and download videos or photos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bafana Motana" }]
dependencies = [
    "PyGetWindow>=0.0.9",
    "PyYAML>=6.0",
    "pyperclip>=1.8",
    "requests>=2.31",
    "selenium>=4.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["resources"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F541"]
